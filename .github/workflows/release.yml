# Push a tag like v1.2.0 to build NXTerm.exe and publish a GitHub Release.
# Installed copies of NXTerm find the new release through Help > Check for updates.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet run --project NXTerm.Tests -c Release

      # Two downloads: the small one needs the .NET 10 Desktop Runtime, the standalone one needs nothing installed.
      - name: Publish NXTerm.exe and NXTerm-standalone.exe
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $common = @('-c', 'Release', '-r', 'win-x64', '-p:PublishSingleFile=true', '-p:DebugType=none',
                      "-p:Version=$version", '-p:GitHubRepo=${{ github.repository }}')
          dotnet publish NXTerm/NXTerm.csproj @common -p:SelfContained=false -o publish
          dotnet publish NXTerm/NXTerm.csproj @common -p:SelfContained=true -p:Flavor=standalone `
            -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-standalone
          Move-Item publish-standalone/NXTerm.exe publish/NXTerm-standalone.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/NXTerm.exe
            publish/NXTerm-standalone.exe
            LICENSE
            THIRD-PARTY-NOTICES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
